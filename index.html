<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquipoWeb</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef6f7;
      color: #17343b;
      margin: 0;
      padding: 60px 20px;
    }
    main {
      max-width: 760px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 25px #00000015;
    }
    h1 { color: #008b8b; }
    p { line-height: 1.7; }
    .etiqueta {
      display: inline-block;
      background: #d9f4ef;
      padding: 8px 14px;
      border-radius: 20px;
    }
  </style>

<body>
  <main>
    <span class="etiqueta">U1 · Actividad 8</span>
    <h1>EquipoWeb</h1>
    <h2>Versionamiento y despliegue continuo</h2>
    <p>Prototipo de una aplicación web para organizar las tareas
    de un equipo distribuido.</p>
    <p>Este proyecto utiliza Git y GitHub para administrar versiones.
    Su despliegue se automatizará con GitHub Actions y GitHub Pages.</p>
  </main>

</html>
